apiVersion: v1
kind: ConfigMap
metadata:
  name: notifications-api-config
  labels:
    app: notifications-api
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_HTTP_PORTS: "8080"
  RabbitMq__Host: "rabbitmq"
  RabbitMq__Port: "5672"
  RabbitMq__VirtualHost: "/"
  RabbitMq__Queues__UserCreated: "UserCreatedEvent"
  RabbitMq__Queues__PaymentProcessedNotifications: "PaymentProcessedEvent.Notifications"
  Services__UserApiUrl: "http://user-api:80"
  Services__CatalogApiUrl: "http://catalog-api:80"
  Services__PaymentsApiUrl: "http://payments-api:80"
  Services__NotificationsApiUrl: "http://notifications-api:80"

